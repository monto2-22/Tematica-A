<script>
/*# WorldCave — Los cuatro elementos

Abre index.html en el navegador. No necesitas conexión ni instalación.

- Juega solo o con otra persona por turnos en el mismo dispositivo.
- Muévete con WASD o las flechas. Pulsa E para interactuar y Espacio para atacar.
- Usa 1–5 para elegir arma, R para cambiar armadura, M para el mapa y P para pausar.
- Explora la superficie, abre el cofre y derrota a los cuatro guardianes. El último deja la llave para rescatar a la princesa.

## 5. Criterios de aceptación

Ejecuta `node --test tests/criterios.test.cjs tests/estructuras.test.cjs` desde la carpeta del juego. Las pruebas usan el mismo JavaScript que ejecuta el navegador.

| ID | Criterio | Verificable mediante |
|---|---|---|
| CA-01 | Derrotar a un enemigo menor suma puntos | test_derrotar_enemigo_suma_puntos |
| CA-02 | Derrotar al guardián elemental desbloquea el descenso | test_derrotar_jefe_siguiente_nivel |
| CA-03 | Intentar avanzar con el nivel bloqueado produce un error controlado | test_nivel_bloqueado_lanza_error |
| CA-04 | La experiencia de combate aumenta el nivel del héroe | test_acumular_experiencia_sube_nivel |
| CA-05 | Equipar un arma o armadura modifica el ataque o la protección elemental | test_equipar_armadura_elemental_actualiza_stats |
| CA-06 | Agotar las tres vidas termina el turno o la partida | test_game_over |
| CA-07 | La llave del cuarto jefe abre la jaula y completa la aventura | test_completa_juego_al_rescatar_princesa |
| CA-08 | El menú ofrece uno o dos jugadores con tres vidas cada uno | test_elegir_modo_y_asignar_vidas |
| CA-09 | El Jugador 2 comienza cuando el primero agota sus vidas o rescata a la princesa | test_cambiar_turno |

## Estructuras de datos

| Capacidad del dominio | Estructura elegida | Por qué esta | Alternativa descartada y motivo | Complejidad clave |
|---|---|---|---|---|
| Eventos del juego | Cola de prioridad / montículo | Ejecuta ataques según su hora y conserva el orden de llegada en los empates | FIFO no ordena fechas distintas | O(log N) por inserción o extracción |
| Puntajes del jugador | Contador numérico por jugador | Actualiza el total directamente | AVL serviría para un ranking ordenado | O(1) |
| Ruta de enemigos | Grafo (lista de adyacencia) | A* busca la ruta de menor costo y penaliza los pasos muy cercanos a obstáculos | Matriz de adyacencia necesita O(V²) de espacio | O(E log V) por búsqueda |
| Representación del mapa | Matriz dispersa | Usa Map como soporte para guardar solo las celdas con obstáculos cercanos | Matriz densa reservaría espacio para todas las celdas | Acceso a la celda O(1) esperado, más sus candidatos |
| Inventario del jugador | Arreglo / arreglo dinámico | Permiten acceder por índice y añadir equipo al final | Lista enlazada requiere recorrer nodos para acceder por índice | O(1) por índice; O(N) para comprobar pertenencia |
| Turnos locales y vidas | Arreglo fijo | Guarda la partida de cada jugador y accede a ella por índice | Lista circular volvería al primer jugador | O(1) |
| Acciones de los enemigos | Arreglo / arreglo dinámico | El ciclo revisa el estado de cada enemigo y decide si debe moverse o preparar un ataque | Lista circular modelaría turnos | O(N) para recorrerlos, más las búsquedas y eventos |
| Deshacer y rehacer | Pila | Dos pilas LIFO revierten o restauran el último cambio manual de equipamiento | Lista doble exige mantener un cursor | O(1) amortizado por operación de pila |

Usa **Z** y **Y**, o los botones del inventario, para deshacer y rehacer cambios manuales de equipo. El historial se reinicia al cargar una zona, reintentar o recibir equipo automático. Estas acciones no restauran vida ni revierten el combate.

## Plan técnico y dificultad

La superficie es el punto de partida. El arreglo fijo niveles contiene solo las cuatro cuevas, con índices del 0 al 3. Los enemigos menores suman puntos y experiencia. Derrotar al jefe abre el descenso y el cuarto jefe deja la llave de la jaula.

| Cueva | Enemigos menores | Salud del jefe | Proyectiles por ataque del jefe |
|---|---:|---:|---:|
| Fuego | 4 | 109 | 3 |
| Agua | 5 | 140 | 4 |
| Tierra | 6 | 176 | 5 |
| Viento | 7 | 219 | 6 |

En cada descenso también aumentan la salud y la velocidad de los enemigos menores, los proyectiles viajan más rápido y el tiempo para esquivarlos se reduce. El código usa el plan técnico de plan.md y las ocho estructuras de estructura.md.

## Carpeta estructuras/

Cada archivo contiene la implementación que usa el juego. Abre index.html después de extraer todos los archivos del ZIP.

- cola-prioridad.js — montículo para eventos y búsqueda de rutas.
- contador-puntaje.js — suma de puntos del jugador.
- grafo-adyacencia.js — búsqueda de rutas por los vecinos transitables.
- matriz-dispersa.js — celdas del mapa con obstáculos.
- arreglo-inventario.js — armas y armaduras.
- arreglo-fijo.js — jugadores y niveles.
- arreglo-enemigos.js — enemigos de cada cueva.
- pila.js — deshacer y rehacer cambios de equipo.

## Organización del proyecto

- dominio/juego.js contiene las reglas de niveles, combate, vidas, turnos, inventario y rescate.
- estructuras/ contiene los ocho módulos reutilizados por el dominio.
- interfaz.js dibuja el juego en Canvas y conecta los controles y menús.
- tests/criterios.test.cjs verifica CA-01 a CA-09 y la dificultad creciente.
- tests/estructuras.test.cjs verifica estructuras durante la partida.
- tests/entorno.cjs prepara el navegador simulado compartido por las pruebas. Cumple el papel de conftest.py en la referencia, adaptado a JavaScript.

## Mediciones de A estrella

Ejecuta node tests/mediciones-astar.cjs. El programa compara A* con distancia Manhattan y Dijkstra con heurística cero. Mide el tiempo medio de 300 búsquedas por algoritmo, sin incluir el dibujo ni la construcción del mapa. Reporta coordenadas, costo, pasos y nodos visitados en las cuatro cuevas.


*/
'use strict';

class ColaPrioridad {
 constructor(){this.heap=[];this.sequence=0}
 static before(a,b){return a.at<b.at||(a.at===b.at&&a.order<b.order)}
 add(at,run){
  const event={at,run,order:this.sequence++},h=this.heap;
  let i=h.length;h.push(event);
  while(i>0){
   const parent=(i-1)>>1;
   if(!ColaPrioridad.before(event,h[parent]))break;
   h[i]=h[parent];i=parent;
  }
  h[i]=event;
 }
 take(){
  const h=this.heap,first=h[0],last=h.pop();
  if(!h.length)return first;
  let i=0;
  while(i*2+1<h.length){
   let child=i*2+1;
   if(child+1<h.length&&ColaPrioridad.before(h[child+1],h[child]))child++;
   if(!ColaPrioridad.before(h[child],last))break;
   h[i]=h[child];i=child;
  }
  h[i]=last;return first;
 }
 runDue(now){while(this.heap.length&&this.heap[0].at<=now)this.take().run()}
}

'use strict';

class Pila {
 #elementos = [];
 push(valor) { this.#elementos.push(valor); }
 pop() { return this.#elementos.pop(); }
 clear() { this.#elementos.length = 0; }
}

'use strict';

class MatrizDispersa {
 #celdas = new Map();
 agregar(coordenada, valor) {
  if (!this.#celdas.has(coordenada)) this.#celdas.set(coordenada, []);
  this.#celdas.get(coordenada).push(valor);
 }
 has(coordenada) { return this.#celdas.has(coordenada); }
 get(coordenada) { return this.#celdas.get(coordenada); }
}

'use strict';

// Las aristas conectan vecinos ortogonales y cuestan al menos su distancia.
const distanciaManhattan=(a,b)=>Math.abs(a.x-b.x)+Math.abs(a.y-b.y);

function buscarRuta(start,goal,costoPaso,heuristica=distanciaManhattan){
 const frontier=new ColaPrioridad(),previous=new Map([[start,null]]);
 const costs=new Map([[start,0]]);
 let visitados=0;
 frontier.add(heuristica(start,goal),{node:start,cost:0});
 while(frontier.heap.length){
  const {node,cost}=frontier.take().run;
  if(cost!==costs.get(node))continue;
  visitados++;
  if(node===goal){
   const path=[];
   for(let step=goal;step;step=previous.get(step))path.push(step);
   return {ruta:path.reverse(),costo:cost,visitados};
  }
  for(const neighbor of node.neighbors){
   const nextCost=cost+costoPaso(node,neighbor);
   if(nextCost>=(costs.get(neighbor)??Infinity))continue;
   costs.set(neighbor,nextCost);
   previous.set(neighbor,node);
   frontier.add(nextCost+heuristica(neighbor,goal),{node:neighbor,cost:nextCost});
  }
 }
 return {ruta:[],costo:Infinity,visitados};
}

function rutaMinima(origen,destino,costoPaso){
 return buscarRuta(origen,destino,costoPaso).ruta;
}

'use strict';

function sumarPuntos(actual, puntos) {
 return actual + puntos;
}

 return {weapons:[0], armors:[]};

const dificultad=[

const niveles=Object.freeze(crearArregloFijo(4,(_,index)=>Object.freeze({

const superficie={theme:Z[0],rocks:ROCKS[0],hazards:HAZ[0]};

const spawn={x:120,y:621},chest={x:334,y:544},door={x:1124,y:130},cage={x:1124,y:130};

const fresh=()=>({x:spawn.x,y:spawn.y,hp:16,lives:3,score:0,xp:0,...crearInventario(),weapon:0,armor:0,earned:new Set(),dir:{x:1,y:0},cd:0,inv:0,key:false});
// Turnos locales: el arreglo tiene exactamente una o dos posiciones por partida.
let players=[fresh()];

let events;
// Pilas LIFO de cambios manuales de equipamiento. No rebobinan el combate.
let pilaDeshacer=new Pila(),pilaRehacer=new Pila();
function equip(slot,value){
 const items=slot==='weapon'?p.weapons:p.armors;

const CELL=32, MAX_RADIUS=32;
let matrizDispersa, grafoAdyacencia;
const cellKey=(col,row)=>row*Math.ceil(MW/CELL)+col;
const positionKey=(x,y)=>cellKey(Math.floor(x/CELL),Math.floor(y/CELL));
// Matriz dispersa: solo se crean entradas en las celdas próximas a una roca.
function buildObstacleGrid(){
 matrizDispersa=new MatrizDispersa();
 for(const rock of zonaActual().rocks){
  const [x,y,r]=rock,reach=r+MAX_RADIUS;
  for(let row=Math.floor((y-reach)/CELL);row<=Math.floor((y+reach)/CELL);row++){
   for(let col=Math.max(0,Math.floor((x-reach)/CELL));col<=Math.min(Math.ceil(MW/CELL)-1,Math.floor((x+reach)/CELL));col++){
    const key=cellKey(col,row);
    matrizDispersa.agregar(key,rock);
   }
  }
 }
}
// Grafo disperso: cada nodo guarda solo sus vecinos transitables.
function buildRoutes(){
 grafoAdyacencia=new Map();
 for(let y=CELL/2;y<MH;y+=CELL){
  for(let x=CELL/2;x<MW;x+=CELL){
   if(!solid(x,y,20))grafoAdyacencia.set(positionKey(x,y),{x,y,neighbors:[]});
  }
 }
 for(const node of grafoAdyacencia.values()){
  for(const [dx,dy] of [[CELL,0],[-CELL,0],[0,CELL],[0,-CELL]]){
   const neighbor=grafoAdyacencia.get(positionKey(node.x+dx,node.y+dy));
   if(neighbor&&dist(node,neighbor)===CELL&&!solid(node.x+dx/2,node.y+dy/2,20))node.neighbors.push(neighbor);
  }
 }
}
function clearPath(from,to,radius){
 const steps=Math.max(1,Math.ceil(dist(from,to)/10));
 for(let i=1;i<=steps;i++){
  if(solid(from.x+(to.x-from.x)*i/steps,from.y+(to.y-from.y)*i/steps,radius))return false;
 }
 return true;
}
function nearbyNode(point,radius,reverse=false){

  for(let i=-20;i<=20;i+=10)line([[x+i,y-33+Math.abs(i)*.35],[x+i,y+19]],'#d6b4dc',2);
  label('JAULA',x,y-52);return;
 }
 ellipse(x,y+17,51,23,'#100e19ab');
 for(let i=5;i>=0;i--){let w=34+i*3,h=48+i*2;c.beginPath();c.moveTo(x-w,y+19);c.lineTo(x-w,y-5);c.quadraticCurveTo(x-w,y-h,x,y-h);c.quadraticCurveTo(x+w,y-h,x+w,y-5);c.lineTo(x+w,y+19);c.closePath();c.fillStyle=i===0?(locked?'#241f2a':'#141427'):i%2?'#423d4a':'#615164';c.fill()}
 if(!locked){for(let i=0;i<5;i++){let a=time*1.3+i*2.4;ellipse(x+Math.sin(a)*23,y-12+Math.cos(a*1.17)*25,2,2,Z[level][4])}}
 else line([[x-25,y-7],[x+24,y+11],[x+24,y-7],[x-25,y+11]],'#b5959b',3);
 label(level?(locked?'SELLADO':'DESCENSO'):'ENTRADA',x,y-68,locked?'#d9bac1':'#fff0b4');
}
function box(){
 const {x,y}=chest;ellipse(x,y+8,25,12,'#16121d88');c.fillStyle='#794631';c.fillRect(x-19,y-8,38,24);
 c.fillStyle='#c98248';c.fillRect(x-19,y-(opened?20:14),38,10);c.fillStyle='#eec879';c.fillRect(x-13,y-14,4,29);c.fillRect(x+9,y-14,4,29);c.fillRect(x-3,y-4,6,7);
 if(!opened){ellipse(x,y-24+Math.sin(time*4)*3,3,3,'#ffe0a0');label('COFRE',x,y-37)}

function actor(e,hero,tint,boss,scale){
 const x=e.x,y=e.y,d=hero?(e.dir.x<0?-1:1):e.dir,walk=hero&&[...keys].some(k=>k.startsWith('arrow')||'wasd'.includes(k));
 c.save();c.translate(x,y);c.scale(d*scale,scale);
 ellipse(0,12,hero?15:17,7,'#0d0d1799');if(hero&&p.inv>0)c.globalAlpha=.5+.5*Math.abs(Math.sin(time*25));
 const stride=walk?Math.sin(time*18)*4:0;
 line([[-6,4],[-7-stride,11]],'#1a1729',6);line([[6,4],[7+stride,11]],'#1a1729',6);
 poly([[-9,-10],[-16,8],[-6,10],[6,5],[8,-10]],hero?'#b66050':tint+'85','#191526');
 poly([[-9,-13],[8,-13],[13,-4],[8,6],[-9,6],[-12,-4]],hero?'#46627a':'#342b42','#191526');
 line([[-7,3],[7,3]],tint,3);
 ellipse(0,-16,10,11,hero?'#eed5b6':tint);poly([[-11,-15],[-10,-24],[-1,-29],[8,-25],[11,-16],[2,-19],[-5,-15]],hero?'#607b91':'#242034','#161524');
 if(boss){poly([[-9,-21],[-15,-36],[-4,-27]],tint);poly([[7,-21],[14,-36],[3,-27]],tint);ellipse(0,-23,3,3,'#fff1ba')}
 ellipse(4,-16,2,1.6,hero?'#332337':'#fff2b4');
 if(hero){line([[11,0],[20,-13]],'#f9e9c6',3);ellipse(20,-13,3,3,COL[p.weapon])}
 c.restore();
}
function item(q,type){

 if(type==='key'){c.strokeStyle='#ffd66c';c.lineWidth=3;c.beginPath();c.arc(q.x-6,yy,5,0,7);c.stroke();line([[q.x-1,yy],[q.x+11,yy],[q.x+11,yy+4]],'#ffd66c',3);label('LLAVE',q.x,yy-14)}
 else{ellipse(q.x,yy+2,8,9,'#f76c95');ellipse(q.x-2,yy,2,4,'#ffc2d1');line([[q.x-3,yy-8],[q.x+3,yy-8]],'#ffdfa0',4);label('POCIÓN',q.x,yy-14)}
}

 const x=W-169,y=15,s=.12;
 c.fillStyle='#151522eb';c.fillRect(x-7,y-6,164,111);c.strokeStyle='#8c789688';c.lineWidth=1;c.strokeRect(x-7,y-6,164,111);
 for(const q of seen){const [a,b]=q.split(',').map(Number);c.fillStyle='#857894';c.fillRect(x+a*70*s,y+b*70*s,70*s-1,70*s-1)}
 ellipse(x+p.x*s,y+p.y*s,3.5,3.5,'#ffda93');
}
function draw(){
 cacheTerrain();
 c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,W,H);c.save();c.translate(-cx,-cy);c.drawImage(terrain,0,0);
 for(const h of zonaActual().hazards)hazard(...h);
 if(!level){box();ellipse(spawn.x,spawn.y+40,19,10,'#211c26');ellipse(spawn.x,spawn.y+34,8,10,'#ffb06b');ellipse(spawn.x,spawn.y+38,4,6,'#ffeb8a')}
 gate();
 for(const e of enemies)if(!e.hp)ellipse(e.x,e.y,10,5,COL[level]+'45');
 if(drop)item(drop,'key');if(potion)item(potion,'potion');
 for(const e of [...enemies.filter(e=>e.hp),p].sort((a,b)=>a.y-b.y)){
  if(e===p){actor(e,true,p.armor?COL[p.armor]:'#f5dfad',false,1);continue}
  if(e.wind>0){ellipse(e.x,e.y+11,e.r+10,e.r*.59,COL[level]+'75');line([[e.x,e.y],[e.x+Math.cos(e.aim)*103,e.y+Math.sin(e.aim)*103]],COL[level]+'77',2)}
  actor(e,false,e.flash?'#fff1dc':COL[level],e.boss,e.boss?1.65:.91);
  if(e.boss||e.hp<e.max){const w=e.boss?83:31,y=e.y-(e.boss?68:33);c.fillStyle='#111018';c.fillRect(e.x-w/2,y,w,5);c.fillStyle=COL[level];c.fillRect(e.x-w/2,y,w*e.hp/e.max,5);if(e.boss)label('GUARDIÁN DE '+Z[level][0].toUpperCase(),e.x,y-7,COL[level],11)}
 }
 for(const b of shots){const tint=COL[b.el];line([[b.x-b.vx*.034,b.y-b.vy*.034],[b.x,b.y]],tint+'77',b.friendly?6:4);ellipse(b.x,b.y,b.friendly?6:5,b.friendly?6:5,tint);ellipse(b.x,b.y,2,2,'#fff1dc')}
 for(const f of fx){c.globalAlpha=Math.min(1,f.life/f.max*2);if(f.arc!==undefined){c.beginPath();c.arc(f.x,f.y,39,f.arc-1,f.arc+1);c.strokeStyle='#ffebbf';c.lineWidth=5;c.stroke()}else ellipse(f.x,f.y,2.5,2.5,f.color)}c.globalAlpha=1;
 if(mode==='play'&&near)label(near,p.x,p.y-42);
 c.restore();
 const shade=c.createRadialGradient(W/2,H/2,135,W/2,H/2,W*.66);shade.addColorStop(0,'#100b1a00');shade.addColorStop(1,'#08071388');c.fillStyle=shade;c.fillRect(0,0,W,H);
 if(mapOn&&mode!=='menu')mini();
}
let last=0,lastHud=-1;
function frame(ms){const dt=Math.min(.034,(ms-last)/1000);last=ms;if(mode==='play')tick(dt);if(ms-lastHud>100){hud();lastHud=ms}draw();requestAnimationFrame(frame)}
menu();requestAnimationFrame(frame);
